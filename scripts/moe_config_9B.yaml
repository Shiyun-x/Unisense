    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 600

  # Same topology as pc_full_attention_only, but all optimization after the
