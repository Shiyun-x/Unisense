# MoE LoRA FFN 配置文件 — Qwen3.5-9B 专用
#
#   MOE_ARGS=$(python3 scripts/moe_args.py --config scripts/moe_config_9B.yaml --preset pc_full_attention_only)
#   torchrun ... $MOE_ARGS
#
active_preset: full_attention_only

presets:

  # 关闭 MoE
  disabled:
    moe_enable: false

  # Shared Dense FFN LoRA — MSC ablation baseline (no modality routing).
  # Same full-attn groups / rank / proj_mode as full_attention_only MSC;
  # installs SharedDenseFFN (single GateUpDownExpert on all tokens).
  shared_dense:
    moe_enable: true
    moe_shared_dense: true
    moe_group_indices: "0,1,2,3,4,5,6,7"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "none"
    moe_balance_loss_weight: 0.0
    moe_diversity_loss_weight: 0.0

  # One router and three low-rank experts shared by all added modalities.
  # Group 7 / layer 31 is intentionally omitted: a modality-only residual in
  # the final decoder layer cannot reach a later supervised text token.
  shared_pool_3:
    moe_enable: true
    moe_shared_pool: true
    moe_shared_dense: false
    moe_modal_list: "depth,pointcloud,imu,radar,thermal,tactile,motion,smell"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3,4,5,6"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07

  # ────────────────────────────────────────────────────────────────────
  # Depth presets
  # ────────────────────────────────────────────────────────────────────

  # top_standard: groups 0,1,2,3 → layers 3,7,11,15（前 4 组）
  top_standard:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

  # standard: groups 3,4,5 → layers 15,19,23
  standard:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "3,4,5"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.05
    moe_diversity_warmup_steps: 800

  # bottom_4: groups 4,5,6,7 → layers 19,23,27,31（最后 4 组 full attention）
  bottom_4:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "4,5,6,7"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

  # bottom_standard: groups 5,6,7 → layers 23,27,31（下半段）
  bottom_standard:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "5,6,7"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.05
    moe_diversity_warmup_steps: 800

  # full_attention_only: 全部 8 组 → layers 3,7,11,15,19,23,27,31
  full_attention_only:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3,4,5,6,7"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

  # middle_standard: groups 2,3,4,5 → layers 11,15,19,23（中间 4 组）
  middle_standard:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "2,3,4,5"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.05
    moe_diversity_warmup_steps: 800

  # all: 全部 8 组所有层（含 linear attention），共 32 层
  all:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3,4,5,6,7"
    moe_full_attn_only: false
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.05
    moe_diversity_warmup_steps: 800

  # Depth FFN-position ablations against the completed main experiment, which
  # patches all full-attention FFNs.  The `all` ablation patches every decoder
  # FFN; the half variants patch only the full-attention FFNs in the front or
  # back half.  The MoE surgery intentionally drops the final modality-only
  # layer (31), whose residual cannot reach a later supervised text token.
  depth_ffn_all:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3,4,5,6,7"
