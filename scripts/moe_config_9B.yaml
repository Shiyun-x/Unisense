    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

  depth_ffn_front_half:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "0,1,2,3"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

  depth_ffn_back_half:
    moe_enable: true
    moe_modal_list: "depth"
    moe_num_experts: 3
    moe_group_indices: "4,5,6,7"
    moe_full_attn_only: true
    moe_proj_mode: "gate_up_down"
    moe_lora_r: 32
    moe_lora_alpha: 64
    moe_balance_loss_type: "switch+z_loss"
    moe_balance_loss_weight: 0.001
    moe_diversity_loss_weight: 0.07
    moe_diversity_warmup_steps: 500

